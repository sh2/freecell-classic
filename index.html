<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フリーセル (FreeCell)</title>
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <header class="toolbar">
    <h1>フリーセル</h1>
    <div class="controls">
      <button id="new-game-btn" title="新しいゲームを開始">新しいゲーム</button>
      <button id="random-game-btn" title="ランダムなゲーム番号で新しいゲームを開始">ランダム</button>
      <button id="restart-btn" title="同じゲームを最初からやり直す">やり直す</button>
      <button id="undo-btn" title="直前の操作を取り消す">元に戻す</button>
      <button id="auto-move-btn" title="自動でホームに移動できるカードを移動する">自動移動</button>
      <label class="auto-toggle" title="操作のたびに、安全なカードを自動でホームへ送ります">
        <input id="auto-move-toggle" type="checkbox" checked />
        <span>自動でホームへ送る</span>
      </label>
      <label class="seed-label">
        No.<input id="seed-input" type="number" min="1" value="1" />
      </label>
      <span id="move-counter" class="move-counter">手数: 0</span>
      <span id="timer" class="timer">0:00</span>
    </div>
  </header>

  <main id="game">
    <section class="top-area">
      <div id="free-cells" class="free-cells">
        <!-- フリーセル (JS で生成) -->
      </div>
      <div id="home-cells" class="home-cells">
        <!-- ホーム (JS で生成) -->
      </div>
    </section>
    <section id="cascade-area" class="cascade-area">
      <!-- カスケード (JS で生成) -->
    </section>
  </main>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="overlay-title">クリア！</h2>
      <p id="overlay-message"></p>
      <button id="overlay-undo" class="hidden">1手戻す</button>
      <button id="overlay-new-game">新しいゲーム</button>
    </div>
  </div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
