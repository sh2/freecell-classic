<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フリーセル (FreeCell)</title>
  <meta name="description" content="広告なしで遊べるブラウザ版フリーセル。Microsoft版互換のゲーム番号1〜32,000に対応し、ヒントとソルバーを内蔵しています。" />
  <meta property="og:title" content="フリーセル (FreeCell)" />
  <meta property="og:description" content="広告なしで遊べるブラウザ版フリーセル。Microsoft版互換のゲーム番号1〜32,000に対応し、ヒントとソルバーを内蔵しています。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sh2.github.io/freecell-classic/" />
  <meta property="og:image" content="https://sh2.github.io/freecell-classic/src/img/ogp.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="src/img/favicon.svg" />
  <link rel="preload" as="image" href="src/img/magic-circle.png" />
  <link rel="preload" as="image" href="src/img/space-cat.jpg" />
  <link rel="preload" as="image" href="src/img/nebula-backdrop.jpg" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <header class="toolbar">
    <h1>フリーセル</h1>
    <div class="controls">
      <div class="control-group" aria-label="新しいゲーム">
        <button id="new-game-btn" title="ランダムなゲーム番号で新しいゲームを開始">新しいゲーム</button>
        <label class="seed-label" title="ゲーム番号を指定して開始">
          No.<input id="seed-input" type="number" min="1" value="1" />
        </label>
        <button id="start-game-btn" title="入力した番号でゲームを開始">開始</button>
      </div>
      <div class="control-group" aria-label="やり直しとアンドゥ">
        <button id="restart-btn" title="同じゲームを最初からやり直す">やり直す</button>
        <button id="undo-btn" title="直前の操作を取り消す">元に戻す</button>
      </div>
      <div class="control-group" aria-label="ホーム回収">
        <button id="auto-move-btn" title="安全にホームへ送れるカードをまとめて送る">ホームへ送る</button>
        <label class="auto-toggle" title="操作のたびに、安全なカードを自動でホームへ送ります">
          <input id="auto-move-toggle" type="checkbox" checked />
          <span>自動で送る</span>
        </label>
      </div>
      <div class="control-group" aria-label="ヒントと自動解答">
        <button id="hint-btn" title="現在の盤面から次の一手を計算して表示する" aria-live="polite">ヒント</button>
        <label class="auto-toggle" title="解を探索して1手ずつ自動で進めます">
          <input id="auto-solve-toggle" type="checkbox" />
          <span id="auto-solve-label">自動解答</span>
        </label>
      </div>
      <div class="control-group" aria-label="演出">
        <label class="auto-toggle" title="カード移動や勝利時に、光・音・紙吹雪で派手に演出します">
          <input id="dopa-toggle" type="checkbox" autocomplete="off" />
          <span>ドパモード</span>
        </label>
      </div>
      <div class="control-group control-group--info" aria-label="情報">
        <span id="move-counter" class="move-counter">手数: 0</span>
        <span id="timer" class="timer">0:00</span>
      </div>
    </div>
  </header>

  <main id="game">
    <section class="top-area">
      <div id="free-cells" class="free-cells">
        <!-- フリーセル (JS で生成) -->
      </div>
      <div id="home-cells" class="home-cells">
        <!-- ホーム (JS で生成) -->
      </div>
    </section>
    <section id="cascade-area" class="cascade-area">
      <!-- カスケード (JS で生成) -->
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 Sadao Hiratsuka</span>
    <a
      class="repo-link"
      href="https://github.com/sh2/freecell-classic"
      target="_blank"
      rel="noopener"
      title="GitHub リポジトリを開く"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
      </svg>
      sh2/freecell-classic
    </a>
  </footer>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="overlay-title">クリア！</h2>
      <p id="overlay-message"></p>
      <button id="overlay-undo" class="hidden">1手戻す</button>
      <button id="overlay-new-game">新しいゲーム</button>
    </div>
  </div>

  <div
    id="confirm-dialog"
    class="overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-message"
  >
    <div class="overlay-card">
      <h2 id="confirm-title">やり直しますか？</h2>
      <p id="confirm-message">現在の盤面と手数は失われ、元に戻せません。</p>
      <div class="confirm-actions">
        <button id="confirm-cancel-btn" class="btn-secondary">キャンセル</button>
        <button id="confirm-ok-btn">やり直す</button>
      </div>
    </div>
  </div>

  <div id="solution-panel" class="solution-panel hidden">
    <div class="solution-card">
      <div class="solution-head">
        <h2>解答手順</h2>
        <button id="solution-close-btn" title="閉じる">✕</button>
      </div>
      <p id="solution-summary"></p>
      <ol id="solution-list"></ol>
    </div>
  </div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
