<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- フェルト緑の背景 (style.css の felt 系カラーに合わせた放射グラデーション) -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="0%" r="130%">
      <stop offset="0%" stop-color="#2a8a60" />
      <stop offset="45%" stop-color="#1c6b48" />
      <stop offset="100%" stop-color="#14533a" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#felt)" />
  <!-- 後ろに見える金色のカード (gold) -->
  <g transform="rotate(10 34.5 33.5)">
    <rect x="22.5" y="16.5" width="24" height="34" rx="3.5" fill="#e6c15a" />
  </g>
  <!-- 手前の白いカードとハート (カード赤 #c8322b) -->
  <g transform="rotate(-10 29.5 30.5)">
    <rect x="17.5" y="13.5" width="24" height="34" rx="3.5" fill="#fffdf7" />
    <path
      d="M29.5 39.5 C 24 35, 21.5 31.9, 21.5 28.6 C 21.5 26.1, 23.5 24.2, 26 24.2 C 27.5 24.2, 28.9 25, 29.5 26.2 C 30.1 25, 31.5 24.2, 33 24.2 C 35.5 24.2, 37.5 26.1, 37.5 28.6 C 37.5 31.9, 35 35, 29.5 39.5 Z"
      fill="#c8322b"
    />
  </g>
</svg>
